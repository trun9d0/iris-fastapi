<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris SVM Classification</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 450px; }
        h2 { text-align: center; color: #4F46E5; margin-bottom: 5px; }
        p.subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 25px; }
        .form-group { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .input-box { width: 48%; }
        label { font-size: 14px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px;}
        button { width: 100%; padding: 12px; background-color: #4F46E5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #4338ca; }
        #result { margin-top: 25px; text-align: center; font-weight: bold; font-size: 20px; color: #10B981; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Iris SVM Classification</h2>
        <p class="subtitle">Nhập bốn kích thước, sau đó API sẽ dự đoán loại hoa.</p>

        <div class="form-group">
            <div class="input-box"><label>Sepal length (cm)</label><input type="number" id="sl" step="0.1" value="5.1"></div>
            <div class="input-box"><label>Sepal width (cm)</label><input type="number" id="sw" step="0.1" value="3.5"></div>
        </div>
        <div class="form-group">
            <div class="input-box"><label>Petal length (cm)</label><input type="number" id="pl" step="0.1" value="1.4"></div>
            <div class="input-box"><label>Petal width (cm)</label><input type="number" id="pw" step="0.1" value="0.2"></div>
        </div>

        <!-- Bước 14: Gọi API được xử lý ngầm ở nút bấm này -->
        <button onclick="predict()">Dự đoán loại hoa</button>
        <div id="result"></div>
    </div>

    <script>
        function predict() {
            // Lấy dữ liệu từ 4 ô nhập
            const data = {
                sepal_length: parseFloat(document.getElementById('sl').value),
                sepal_width: parseFloat(document.getElementById('sw').value),
                petal_length: parseFloat(document.getElementById('pl').value),
                petal_width: parseFloat(document.getElementById('pw').value)
            };

            document.getElementById('result').innerText = "Đang dự đoán...";

            // Tương đương Bước 14 trong tài liệu: Gọi API bằng Javascript
            fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').innerText = "Kết quả: Hoa " + data.prediction;
            })
            .catch(error => {
                document.getElementById('result').innerText = "Lỗi kết nối API!";
                document.getElementById('result').style.color = "red";
            });
        }
    </script>
</body>
</html>
