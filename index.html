<<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Classification & Species Wiki</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --title-color: #38bdf8;
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-border: rgba(255, 255, 255, 0.2);
            --preset-bg: rgba(255, 255, 255, 0.08);
            --preset-text: #e2e8f0;
            --wiki-bg: rgba(0, 0, 0, 0.25);
            --shadow-color: rgba(0, 0, 0, 0.5);
        }

        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            --card-bg: rgba(255, 255, 255, 0.65);
            --border-color: rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --title-color: #4f46e5;
            --input-bg: rgba(255, 255, 255, 0.85);
            --input-border: rgba(79, 70, 229, 0.2);
            --preset-bg: rgba(79, 70, 229, 0.1);
            --preset-text: #3730a3;
            --wiki-bg: rgba(255, 255, 255, 0.5);
            --shadow-color: rgba(79, 70, 229, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }
        
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .app-container {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px var(--shadow-color);
        }

        .left-panel, .right-panel { flex: 1; padding: 40px; }
        .left-panel { border-right: 1px solid var(--border-color); }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        h1 { font-size: 1.8rem; color: var(--title-color); }
        
        .btn-theme {
            background: var(--preset-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-theme:hover { opacity: 0.8; }

        p.subtitle { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 24px; }
        
        .presets-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 10px; font-weight: 600; }
        .presets-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .btn-preset {
            background: var(--preset-bg);
            border: 1px solid var(--border-color);
            color: var(--preset-text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-preset:hover { background: var(--title-color); color: #fff; font-weight: bold; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .input-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
        }
        .input-group input:focus { border-color: var(--title-color); }
        
        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

        .right-panel { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .placeholder-state { color: var(--text-secondary); }
        .result-card { width: 100%; display: none; animation: fadeIn 0.4s ease-in-out forwards; }
        .flower-image { width: 100%; height: 210px; object-fit: cover; border-radius: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        .species-name { font-size: 1.6rem; color: #10b981; text-transform: capitalize; margin-bottom: 12px; font-weight: 700; }
        .wiki-box {
            background: var(--wiki-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 0.88rem;
            line-height: 1.6;
            border: 1px solid var(--border-color);
        }
        .wiki-item { margin-bottom: 8px; color: var(--text-primary); }
        .wiki-item:last-child { margin-bottom: 0; }
        .wiki-item strong { color: var(--title-color); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .app-container { flex-direction: column; } .left-panel { border-right: none; border-bottom: 1px solid var(--border-color); } }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Cột trái: Form nhập liệu & Preset -->
    <div class="left-panel">
        <div class="header-row">
            <h1>Phân Loại Hoa Iris</h1>
            <button class="btn-theme" onclick="toggleTheme()" id="themeBtn">🌙 Chế độ tối</button>
        </div>
        <p class="subtitle">Mô hình Support Vector Machine (SVM) Classifier</p>

        <div class="presets-title">Điền nhanh tham số mẫu (Centroids):</div>
        <div class="presets-group">
            <button class="btn-preset" onclick="applyPreset(5.0, 3.4, 1.5, 0.2)">Setosa (5.0, 3.4, 1.5, 0.2)</button>
            <button class="btn-preset" onclick="applyPreset(5.9, 2.7, 4.2, 1.3)">Versicolor (5.9, 2.7, 4.2, 1.3)</button>
            <button class="btn-preset" onclick="applyPreset(6.5, 2.9, 5.5, 2.0)">Virginica (6.5, 2.9, 5.5, 2.0)</button>
            <button class="btn-preset" onclick="applyRandom()">🎲 Ngẫu nhiên</button>
        </div>

        <div class="form-grid">
            <div class="input-group">
                <label>Chiều dài đài hoa (cm)</label>
                <input type="number" id="sl" step="0.1" value="5.1">
            </div>
            <div class="input-group">
                <label>Chiều rộng đài hoa (cm)</label>
                <input type="number" id="sw" step="0.1" value="3.5">
            </div>
            <div class="input-group">
                <label>Chiều dài cánh hoa (cm)</label>
                <input type="number" id="pl" step="0.1" value="1.4">
            </div>
            <div class="input-group">
                <label>Chiều rộng cánh hoa (cm)</label>
                <input type="number" id="pw" step="0.1" value="0.2">
            </div>
        </div>

        <button class="btn-submit" onclick="predictSpecies()">Phân Loại Ngay</button>
    </div>

    <!-- Cột phải: Hình ảnh & Tra cứu Wiki -->
    <div class="right-panel">
        <div id="placeholder" class="placeholder-state">
            <p>👈 Nhập chỉ số hoặc chọn mẫu nhanh, sau đó bấm <strong>Phân Loại Ngay</strong> để xem kết quả và thông tin sinh học.</p>
        </div>

        <div id="resultCard" class="result-card">
            <img id="flowerImg" class="flower-image" src="" alt="Hoa Iris">
            <div id="speciesTitle" class="species-name">Iris Setosa</div>
            <div class="wiki-box">
                <div class="wiki-item"><strong>Tên khoa học:</strong> <span id="wikiSciName"></span></div>
                <div class="wiki-item"><strong>Phân bố:</strong> <span id="wikiDist"></span></div>
                <div class="wiki-item"><strong>Đặc điểm:</strong> <span id="wikiDesc"></span></div>
            </div>
        </div>
    </div>
</div>

<script>
    const wikiData = {
        "setosa": {
            sciName: "Iris setosa",
            dist: "Vùng khí hậu lạnh Bắc Mỹ và Đông Á.",
            desc: "Cánh hoa ngắn, nhỏ, đài hoa xòe rộng. Thường có màu xanh tím đặc trưng.",
            img: "https://upload.wikimedia.org/wikipedia/commons/5/56/Kosaciec_szczecinkowaty_Iris_setosa.jpg"
        },
        "versicolor": {
            sciName: "Iris versicolor",
            dist: "Khu vực đầm lầy, ven hồ Bắc Mỹ.",
            desc: "Kích thước hoa trung bình, cánh hoa có vân sọc mượt mà.",
            img: "https://upload.wikimedia.org/wikipedia/commons/4/41/Iris_versicolor_3.jpg"
        },
        "virginica": {
            sciName: "Iris virginica",
            dist: "Đồng cỏ ẩm ướt vùng Đông Bắc Mỹ.",
            desc: "Hoa lớn nhất trong 3 loài, cánh hoa dài và có gân hoa vàng đậm nổi bật.",
            img: "https://upload.wikimedia.org/wikipedia/commons/9/9f/Iris_virginica.jpg"
        }
    };

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        document.getElementById('themeBtn').innerText = isLight ? "☀️ Chế độ sáng" : "🌙 Chế độ tối";
    }

    function applyPreset(sl, sw, pl, pw) {
        document.getElementById('sl').value = sl;
        document.getElementById('sw').value = sw;
        document.getElementById('pl').value = pl;
        document.getElementById('pw').value = pw;
    }

    function applyRandom() {
        document.getElementById('sl').value = (Math.random() * (7.5 - 4.3) + 4.3).toFixed(1);
        document.getElementById('sw').value = (Math.random() * (4.4 - 2.0) + 2.0).toFixed(1);
        document.getElementById('pl').value = (Math.random() * (6.9 - 1.0) + 1.0).toFixed(1);
        document.getElementById('pw').value = (Math.random() * (2.5 - 0.1) + 0.1).toFixed(1);
    }

    async function predictSpecies() {
        const payload = {
            sepal_length: parseFloat(document.getElementById('sl').value),
            sepal_width: parseFloat(document.getElementById('sw').value),
            petal_length: parseFloat(document.getElementById('pl').value),
            petal_width: parseFloat(document.getElementById('pw').value)
        };

        try {
            const res = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            
            const species = data.prediction.toLowerCase();
            const info = wikiData[species];

            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('resultCard').style.display = 'block';

            document.getElementById('flowerImg').src = info.img;
            document.getElementById('speciesTitle').innerText = "Iris " + species;
            document.getElementById('wikiSciName').innerText = info.sciName;
            document.getElementById('wikiDist').innerText = info.dist;
            document.getElementById('wikiDesc').innerText = info.desc;

        } catch (err) {
            alert('Lỗi kết nối API!');
        }
    }
</script>

</body>
</html>
